<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>밍카 AI 블로그 작성기</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:0 auto;padding:24px;background:#f7f6fb;color:#222}main{background:#fff;padding:24px;border-radius:18px}h1{margin-top:0}label{display:block;font-weight:700;margin:16px 0 7px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}textarea{min-height:280px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{margin-top:12px;cursor:pointer;font-weight:800}.primary{background:#7567e8;color:#fff;border:0}.muted{font-size:12px;color:#777}.status{margin-top:12px;padding:10px;border-radius:10px;background:#faf9ff}.result{margin-top:20px} @media(max-width:700px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>🚗 밍카 AI 블로그 작성기</h1>
<p class="muted">매번 새로운 자동차 관련 주제를 만들고, 인사말·본문·이미지 위치·끝인사까지 한 번에 작성합니다.</p>
<label>Gemini API 키</label>
<input id="apiKey" type="password" placeholder="Gemini API 키 입력">
<div class="row">
<div><label>AI 모델</label><select id="model"><option>gemini-3.8-flash</option><option>gemini-3.7-flash</option><option>gemini-3.6-flash</option><option>gemini-3.5-flash</option><option>gemini-3.5-flash-lite</option><option>gemini-2.5-flash</option></select></div>
<div><label>글 길이</label><select id="length"><option value="normal">보통</option><option value="short">짧게</option><option value="long">길게</option></select></div>
</div>
<label>주제</label>
<select id="topic"><option value="">직접 입력하려면 아래에 주제를 적거나 새 주제를 뽑으세요.</option></select>
<input id="topicManual" placeholder="직접 주제를 입력할 수 있습니다.">
<button id="randomBtn" class="btn">🎲 새로운 주제 뽑기</button>
<button id="generateBtn" class="btn primary">✨ AI 글 생성</button>
<div id="status" class="status">준비 완료</div>
<section class="result">
<label>제목</label><input id="title">
<label>본문</label><textarea id="body"></textarea>
<label>해시태그</label><input id="tags">
<button id="copyBtn" class="btn">📋 전체 글 복사</button>
</section>
</main>
<script>
/* MINGCARAI_WEB_V1: 웹에서 바로 사용하는 밍카 블로그 작성기입니다. */
const MINGKA_URL='https://carpick-korea.carpick.workers.dev/';
const usedKey='mingcarai_used_topics_v1';
const subjects=['자동차 장기렌트','자동차 리스','신차 구매','중고차 구매','자동차 보험','차량 유지비','장기렌트 계약','리스 계약','자동차 보증금','리스 선납금','장기렌터카 주행거리','자동차 계약기간','계약 종료 후 차량','첫 차 선택','출퇴근용 자동차','가족용 자동차','전기차','하이브리드 자동차','SUV 선택','세단 선택','경차 선택'];
const endings=['계약 전에 꼭 확인해야 할 기준','비교할 때 먼저 살펴볼 조건','초보자가 놓치기 쉬운 부분','비용을 따질 때 확인할 항목','내 상황에 맞는 선택 기준','알아두면 좋은 체크포인트','이용 전에 확인하면 좋은 내용','선택할 때 주의할 점','장단점을 비교하는 방법'];
function used(){try{return JSON.parse(localStorage.getItem(usedKey)||'[]')}catch(e){return[]}}
function saveUsed(a){localStorage.setItem(usedKey,JSON.stringify(a.slice(-500)))}
function localTopic(){let u=used();let pool=[];for(const s of subjects)for(const e of endings){let t=`${s}, ${e}`;if(t.length>=20&&!u.includes(t))pool.push(t)}return pool[Math.floor(Math.random()*pool.length)]||'자동차를 선택할 때 예산과 이용 기간을 함께 살펴보는 방법'}
function setTopic(t){let s=document.getElementById('topic');s.innerHTML='';let o=document.createElement('option');o.value=t;o.textContent=t;s.appendChild(o);s.value=t;let u=used();if(!u.includes(t))u.push(t);saveUsed(u);document.getElementById('topicManual').value=''}
async function aiTopic(){const key=document.getElementById('apiKey').value.trim();const model=document.getElementById('model').value;let u=used().slice(-120);if(!key){setTopic(localTopic());return}const prompt=`자동차 정보 블로그 밍카의 새 제목을 1개만 만들어라. 20~55자의 완성형 제목이어야 한다. 자동차 장기렌트, 자동차 리스, 신차, 중고차, 보험, 세금, 유지비, 계약, 전기차 등과 관련된 구체적인 질문·비교·체크포인트·선택 기준을 포함한다. 단어만 출력하지 말고 제목 한 줄만 출력한다. 이전 제목과 같은 내용은 피한다. 이전 제목: ${u.join(' | ')}`;try{const r=await call(prompt,model,key);let t=r.trim().replace(/^```.*?\n|```$/g,'').replace(/^\d+[.)]\s*/,'').replace(/^['"“”]+|['"“”]+$/g,'').trim();if(t.length>=20&&t.length<=55&&!u.includes(t)){setTopic(t);return}}catch(e){}setTopic(localTopic())}
async function call(prompt,model,key){const models=[model,'gemini-3.8-flash','gemini-3.7-flash','gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite','gemini-2.5-flash'].filter((x,i,a)=>x&&a.indexOf(x)===i);let last='';for(const m of models)for(let n=0;n<2;n++){try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:.8,maxOutputTokens:7000}})});const d=await r.json();if(r.ok){let raw=d?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('').trim();if(!raw)throw Error('빈 응답');raw=raw.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/\s*```$/,'').trim();try{return JSON.parse(raw)}catch(e){let a=raw.indexOf('{'),b=raw.lastIndexOf('}');if(a>=0&&b>a)return JSON.parse(raw.slice(a,b+1));throw Error('JSON 응답 오류')}}last=d?.error?.message||`API ${r.status}`;if([429,500,502,503,504].includes(r.status)){await new Promise(x=>setTimeout(x,700*(n+1)));continue}if([400,401,403].includes(r.status))throw Error(last);break}catch(e){last=e.message;if(n===0)await new Promise(x=>setTimeout(x,500))}}throw Error(last||'AI 요청 실패')}
function selectedTopic(){return document.getElementById('topicManual').value.trim()||document.getElementById('topic').value.trim()}
function promptFor(t){const len=document.getElementById('length').value==='short'?'900~1200자':document.getElementById('length').value==='long'?'2200~3000자':'1400~1900자';return `한국 네이버 블로그용 자동차 정보글을 작성하라. 주제: ${t}. 분량: ${len}. 글 첫 부분에 자연스러운 인사말 2~3문장. 본문은 4~6개 소제목. 핵심 내용 사이에 주제에 맞는 이미지 4~6개를 자연스럽게 배치하고 반드시 [IMAGE_1]\n[이미지 설명: 구체적인 장면] 형식으로 표시한다. 마지막에는 핵심 정리와 자연스러운 끝인사 2~3문장. 끝인사 뒤 밍카를 과하지 않게 소개하고 다음 URL을 단독 줄에 넣는다: ${MINGKA_URL}. 확인되지 않은 가격·할인율·순위·통계·업체 우위를 만들지 않는다. 개인정보를 수집한다고 표현하지 않는다. JSON 하나만 출력: {"title":"제목","body":"본문","tags":"#태그 #태그"}`}
function normalize(s){return s.replace(/\(${MINGKA_URL.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\)/g,MINGKA_URL).replace(new RegExp('('+MINGKA_URL.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\s*[)]','g'),'$1')}
document.getElementById('randomBtn').onclick=async()=>{document.getElementById('randomBtn').disabled=true;document.getElementById('status').textContent='새로운 주제를 만드는 중...';await aiTopic();document.getElementById('status').textContent='새 주제 선택 완료';document.getElementById('randomBtn').disabled=false}
document.getElementById('generateBtn').onclick=async()=>{const t=selectedTopic();if(!t){alert('먼저 주제를 선택해주세요.');return}document.getElementById('generateBtn').disabled=true;document.getElementById('status').textContent='AI가 글을 작성하고 있습니다...';try{const d=await call(promptFor(t),document.getElementById('model').value,document.getElementById('apiKey').value.trim());if(!d.title||!d.body)throw Error('제목 또는 본문이 없습니다.');document.getElementById('title').value=d.title.trim();document.getElementById('body').value=normalize(String(d.body).trim());document.getElementById('tags').value=d.tags||'';document.getElementById('status').textContent='글 생성 완료'}catch(e){document.getElementById('status').textContent='생성 실패: '+e.message}finally{document.getElementById('generateBtn').disabled=false}}
document.getElementById('copyBtn').onclick=async()=>{const s=[document.getElementById('title').value,document.getElementById('body').value,document.getElementById('tags').value].filter(Boolean).join('\n\n');await navigator.clipboard.writeText(s);document.getElementById('status').textContent='전체 글을 복사했습니다.'}
</script>
</body>
</html>
